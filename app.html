<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Student Plus — تطبيق الويب والآيفون</title>
  <meta name="theme-color" content="#164B7A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Student Plus" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./assets/images/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="ambient-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page-shell">
    <header class="topbar">
      <div class="container topbar-inner">
        <div id="pwaLogoTrigger" class="brand-lockup" role="button" tabindex="0" title="Student Plus">
          <div class="brand-logo-box">
            <img src="./assets/images/student-plus-logo.png" alt="شعار Student Plus" />
          </div>
          <div>
            <span class="brand-title">Student Plus</span>
            <span id="headerUserMeta" class="brand-subtitle">نسخة الآيفون والويب التفاعلية</span>
          </div>
        </div>

        <div class="nav-actions">
          <button id="pwaGuideBtn" class="icon-btn" type="button" title="دليل الاستخدام" aria-label="دليل الاستخدام" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </button>
          <button id="pwaThemeBtn" class="icon-btn" type="button" title="تبديل المظهر" aria-label="تبديل المظهر">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <a href="./index.html" class="btn btn-glass btn-sm">الموقع التعريفي</a>
          <button id="pwaSignOutBtn" class="btn btn-glass btn-sm" type="button" style="display:none;">خروج</button>
        </div>
      </div>
    </header>

    <main class="pwa-wrapper">
      <!-- iOS Safari Install Prompt -->
      <div id="iosInstallBanner" class="glass-card device-banner" style="display:none; margin-bottom:14px;">
        <div>
          <span class="pill pill-emerald">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>ثبّت التطبيق على آيفونك</span>
          </span>
          <div style="font-size:0.86rem; color:var(--text-muted); margin-top:4px;">
            من سفاري اضغط أيقونة المشاركة (Share) أسفل الشاشة ثم اختر <strong>إضافة إلى الصفحة الرئيسية</strong> ليعمل كالتطبيق الأصلي.
          </div>
        </div>
        <button id="dismissIosBannerBtn" type="button" class="btn btn-glass btn-sm">فهمت</button>
      </div>

      <!-- Dynamic Maintenance Banner -->
      <div id="maintenanceBanner" class="glass-card device-banner" style="display:none; margin-bottom:14px; border-right-color:var(--gold);"></div>

      <!-- Suspended Account Banner -->
      <div id="suspendedBanner" class="glass-card device-banner" style="display:none; margin-bottom:14px; border-right-color:var(--danger);"></div>

      <!-- Main App Root -->
      <div id="pwaRoot">
        <div class="glass-card-elevated" style="padding:36px; text-align:center;">
          <div style="font-size:1.15rem; font-weight:700;">جارٍ الاتصال بمنصة Student Plus...</div>
        </div>
      </div>
    </main>

    <!-- Bottom Tab Navigation (visible when signed in and onboarded) -->
    <nav id="pwaBottomNav" class="pwa-bottom-nav" style="display:none;" aria-label="التنقل داخل التطبيق"></nav>
  </div>

  <!-- Generic Modal Container -->
  <div id="pwaModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="pwaModalPanel" class="glass-card-elevated modal-panel"></div>
  </div>

  <div id="pwaToast" class="toast" role="status" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
